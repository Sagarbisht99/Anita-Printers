name: ci

on:
  push:
    branches: [main, master, frontend]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholders for prisma generate / next build; real secrets come from hosting.
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?sslmode=require
      DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/db?sslmode=require
      SESSION_SECRET: ci-session-secret-at-least-32-chars-long
      NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/example
      NEXT_PUBLIC_IMAGEKIT_PUBLIC_KEY: public_ci_placeholder
      IMAGEKIT_PRIVATE_KEY: private_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

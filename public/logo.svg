<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Top Blue Horizontal Pattern -->
    <pattern id="blueLines" width="400" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="400" y2="8" stroke="#1D6FB8" stroke-width="5" />
    </pattern>
    
    <!-- Bottom Red Horizontal Pattern -->
    <pattern id="redLines" width="400" height="16" patternUnits="userSpaceOnUse">
      <line x1="0" y1="8" x2="400" y2="8" stroke="#C43B58" stroke-width="5" />
    </pattern>
    
    <clipPath id="topRightClip">
      <rect x="180" y="45" width="175" height="155" />
    </clipPath>
    
    <clipPath id="bottomLeftClip">
      <rect x="45" y="200" width="175" height="155" />
    </clipPath>
  </defs>

  <style>
    .letter {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: bold;
    }
  </style>

  <!-- Outer Double Blue Border Box -->
  <rect x="25" y="25" width="350" height="350" fill="none" stroke="#1D6FB8" stroke-width="10" />
  <rect x="45" y="45" width="310" height="310" fill="none" stroke="#1D6FB8" stroke-width="6" />

  <!-- Top Section (Blue Theme) -->
  <rect x="45" y="45" width="135" height="155" fill="#1D6FB8" />
  <rect x="180" y="45" width="175" height="155" fill="none" />
  <rect x="180" y="45" width="175" height="155" fill="url(#blueLines)" clip-path="url(#topRightClip)" />

  <!-- Bottom Section (Red Theme) -->
  <rect x="45" y="200" width="175" height="155" fill="none" />
  <rect x="45" y="200" width="175" height="155" fill="url(#redLines)" clip-path="url(#bottomLeftClip)" />
  <rect x="220" y="200" width="135" height="155" fill="#ffffff" />

  <!-- Middle Horizontal Divider -->
  <line x1="45" y1="200" x2="355" y2="200" stroke="#1D6FB8" stroke-width="4" />

  <!-- White Letter 'A' -->
  <text x="112" y="175" class="letter" font-size="140" fill="#ffffff" text-anchor="middle">A</text>

  <!-- Red Letter 'P' (Restored to Original Right Position) -->
  <text x="287" y="330" class="letter" font-size="140" fill="#C43B58" text-anchor="middle">P</text>
</svg>
